name: cli-bench

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Probe env in a run step
        run: env | grep -i -E 'ACTIONS|RUNTIME' | sed 's/=.*/=<set>/' || echo "no actions env in run step"

      - name: Probe env from a local node action
        uses: ./.github/actions/probe

      - name: Craft malicious zip
        run: |
          mkdir -p out/raw
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('out/raw/cli-bench-report','w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('../../../zipslip-marker.txt', 'ZIP_SLIP_ESCAPED_bench-report\n')
              z.writestr('summary.md', '## hi\n')
              z.writestr('report.md', '## hi\n')
          PY
          ls -l out/raw

      - name: Upload raw file with archive=false
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: out/raw/cli-bench-report
          archive: false
